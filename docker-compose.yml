services:
  aider_runner:
    image: aider:latest
    container_name: aider_runner_blog
    user: "${CURRENT_UID:-1001}:${CURRENT_GID:-1001}"
    tty: true
    stdin_open: true
    env_file:
      - .env
    volumes:
      - /home/now0930/runner_blog:/app
      - /home/now0930/runner_blog/.aider_config:/app/.aider
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_API_BASE=${OLLAMA_BASE}
      - HOME=/app
    working_dir: /app
    command: 
      - "--model"
      - "${GEMINI_MODEL}"
      - "--editor-model"
      - "${MAIN_MODEL}"
      - "--weak-model"
      - "${WEAK_MODEL}"
      - "--architect"
      - "--auto-commits"
      - "--yes-always"
    restart: "no"

networks:
  default:
    name: runner_network
    external: true
